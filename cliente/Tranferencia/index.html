<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transferencia - Consumo de APIs</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 24px;
            background: #f4f7fb;
            color: #1f2937;
        }

        h1, h2 {
            margin-bottom: 12px;
        }

        .descripcion {
            max-width: 900px;
            margin-bottom: 18px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: #ffffff;
        }

        th, td {
            border: 1px solid #d1d5db;
            padding: 10px;
            text-align: left;
            vertical-align: top;
        }

        th {
            background: #e5eef9;
        }

        section {
            background: #ffffff;
            border: 1px solid #dbe4f0;
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 8px 20px rgba(15, 23, 42, 0.06);
        }

        dl {
            display: grid;
            grid-template-columns: 220px 1fr;
            gap: 10px 16px;
            margin: 0;
        }

        dt {
            font-weight: 700;
        }
    </style>
</head>
<body>
    <h1>Actividades de transferencia del conocimiento</h1>
    <p>Activa un solo script a la vez para probar cada ejercicio.</p>

    <div id="app"></div>

    <script src="./ejercicio1.js" type="module"></script>

</body>
</html>
